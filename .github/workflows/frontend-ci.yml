name: Frontend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint
      # Bỏ comment dòng dưới nếu bạn muốn CI không bị lỗi khi có warning
      # continue-on-error: true 

    # Bỏ comment khi dự án của bạn đã có unit tests
    # - name: Run Unit Tests
    #   run: npm test

    - name: Build frontend
      run: npm run build
      env:
        # Khai báo các biến môi trường cần thiết cho build process (nếu có)
        # VITE_API_URL: ${{ secrets.VITE_API_URL }}
        NODE_ENV: production
