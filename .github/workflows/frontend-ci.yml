name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feat/**"
      - "fix/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hisgo-frontend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Typecheck, ESLint & Vitest Coverage (>= 70%)
  # ─────────────────────────────────────────────
  lint-and-unit:
    name: Typecheck, Lint & Unit Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Run Vitest with Coverage Gate (>= 70%)
        run: npm run test:cov

      - name: Upload Unit Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Next.js Production Build
  # ─────────────────────────────────────────────
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint-and-unit

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

  # ─────────────────────────────────────────────
  # JOB 3: Full-Stack Playwright UI E2E Smoke
  # ─────────────────────────────────────────────
  e2e-playwright:
    name: Full-Stack Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-and-unit

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: tlcn_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d tlcn_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://admin:admin@127.0.0.1:5432/tlcn_db
      E2E_DATABASE_URL: postgresql://admin:admin@127.0.0.1:5432/tlcn_db_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      E2E_REDIS_DB: "1"
      CORS_ORIGINS: http://localhost:3010,http://127.0.0.1:3010
      JWT_SECRET: ci-e2e-jwt-secret-tlcn-dt07
      JWT_ACCESS_SECRET: ci-e2e-jwt-access-secret-tlcn-dt07
      JWT_REFRESH_SECRET: ci-e2e-jwt-refresh-secret-tlcn-dt07
      BACKEND_INTERNAL_URL: http://127.0.0.1:5010
      INTERNAL_API_URL: http://127.0.0.1:5010
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5010
      NEXT_DIST_DIR: .next-e2e
      E2E_FE_URL: http://127.0.0.1:3010
      E2E_BE_URL: http://127.0.0.1:5010
      E2E_HEADLESS: "1"
      E2E_DISABLE_AUTH_RATE_LIMIT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Chrome for Playwright
        run: google-chrome --version

      - name: Install & Prepare Backend E2E Environment
        working-directory: ./backend
        run: |
          npm ci
          npm run test:e2e:prepare
          npm run build
          npx ts-node test/seed-ui-e2e.ts

      - name: Install & Build Frontend E2E Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Run Playwright UI E2E Smoke Journeys
        run: |
          mkdir -p backend/coverage frontend/coverage
          (
            cd backend
            PORT=5010 \
            DATABASE_URL="${{ env.E2E_DATABASE_URL }}" \
            REDIS_DB="${{ env.E2E_REDIS_DB }}" \
            REDIS_CACHE_KEY_PREFIX="e2e" \
            exec node dist/src/main.js
          ) > backend/coverage/be-ui-e2e.log 2>&1 &
          BE_PID=$!

          (
            cd frontend
            exec node node_modules/next/dist/bin/next start -p 3010 -H 127.0.0.1
          ) > frontend/coverage/fe-ui-e2e.log 2>&1 &
          FE_PID=$!

          cleanup() {
            kill $FE_PID 2>/dev/null || true
            kill $BE_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5010/metrics >/dev/null && curl -fsS http://127.0.0.1:3010/login >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:5010/metrics >/dev/null || ! curl -fsS http://127.0.0.1:3010/login >/dev/null; then
            cat backend/coverage/be-ui-e2e.log || true
            cat frontend/coverage/fe-ui-e2e.log || true
            exit 1
          fi

          (cd frontend && npm run test:e2e)
          (cd backend && npx ts-node test/seed-ui-e2e.ts --clean) || true

      - name: Upload Playwright E2E Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-e2e-report
          path: frontend/coverage/e2e-report.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4: Docker Build & Smoke Verification
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Smoke Check
    runs-on: ubuntu-latest
    needs: [build, e2e-playwright]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f ./frontend/Dockerfile -t hisgo-frontend:ci ./frontend

      - name: Verify Next.js runtime container serves HTTP 200
        run: |
          docker run -d --name fe-smoke -p 3099:3000 hisgo-frontend:ci
          trap 'docker rm -f fe-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3099/login >/dev/null

      - name: Save Docker image
        run: docker save hisgo-frontend:ci -o hisgo-frontend.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-image
          path: hisgo-frontend.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 5: Trivy Security Scan
  # ─────────────────────────────────────────────
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-docker-image

      - name: Load Docker image
        run: docker load -i hisgo-frontend.tar

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "hisgo-frontend:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

  # ─────────────────────────────────────────────
  # JOB 6: Docker Push (CD Publish)
  # ─────────────────────────────────────────────
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: trivy
    if: >-
      github.repository == 'Nguyen-Thanh-Huy-io/TLCN-DT07' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/develop')

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-docker-image

      - name: Load Docker image
        run: docker load -i hisgo-frontend.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker image
        run: |
          docker tag hisgo-frontend:ci "${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}"
          docker tag hisgo-frontend:ci "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}"
          docker push "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            docker tag hisgo-frontend:ci "${{ env.DOCKER_IMAGE }}:latest"
            docker push "${{ env.DOCKER_IMAGE }}:latest"
          fi

  # ─────────────────────────────────────────────
  # JOB 7: Production Release Approval Gate (CD)
  # ─────────────────────────────────────────────
  deploy-production:
    name: Production Release Gate
    runs-on: ubuntu-latest
    needs: docker-push
    if: >-
      github.repository == 'Nguyen-Thanh-Huy-io/TLCN-DT07' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Record approved release artifact
        run: |
          echo "Approved Frontend image for release:"
          echo " - ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo " - ${{ env.DOCKER_IMAGE }}:latest"
          echo "Smoke endpoint target: GET /login (HTTP 200)"
