name: Frontend CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"

  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hisgo-frontend

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint


  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t hisgo-frontend:ci \
            ./frontend

      - name: Save Docker image
        run: |
          docker save hisgo-frontend:ci -o hisgo-frontend.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-image
          path: hisgo-frontend.tar
          retention-days: 1


  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-docker-image

      - name: Load Docker image
        run: |
          docker load -i hisgo-frontend.tar

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "hisgo-frontend:ci"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: false


  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: trivy

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-docker-image

      - name: Load Docker image
        run: |
          docker load -i hisgo-frontend.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag \
            hisgo-frontend:ci \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest